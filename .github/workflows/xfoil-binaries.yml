name: Build XFOIL binaries

# XFOIL upstream (MIT, GPL) is a fixed release, so this does not run per push.
# Trigger it manually; it publishes binaries to the fixed `xfoil-6.99` release,
# which the app (XfoilManager) downloads and caches like it does for AVL.
on:
  workflow_dispatch:

env:
  XFOIL_URL: https://web.mit.edu/drela/Public/web/xfoil/xfoil6.99.tgz
  RELEASE_TAG: xfoil-6.99
  # Compatibility flags required to build the F77 sources with modern gfortran.
  FL: "-O -fdefault-real-8 -std=legacy -fallow-argument-mismatch"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not `ubuntu-latest`. A binary links against the C library of the machine that built
          # it and refuses to start on anything older: built on 24.04 it needs GLIBC_2.38, and on Ubuntu
          # 22.04 — a current LTS — it dies at the loader before printing a word. That failure is silent
          # in the worst way, because an XFOIL that never starts returns an empty polar, which reads
          # exactly like an aerofoil that never stalls. XfoilManager now smoke-tests the binary and says
          # so; this is the other half, and it builds against the oldest library we mean to support.
          - os: ubuntu-22.04
            platform: linux
            asset: xfoil-linux
          - os: macos-latest
            platform: macos
            asset: xfoil-macos
          - os: windows-latest
            platform: windows
            asset: xfoil-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      # ---------- Linux: X11 backend (validated recipe) ----------
      - name: Build (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran libx11-dev make gcc
          curl -fsSL "$XFOIL_URL" -o xfoil.tgz
          tar xzf xfoil.tgz
          cd Xfoil/plotlib
          cp config.make.gfortranDP config.make
          sed -i "s|^FFLAGS .*|FFLAGS = -m64 -O2 $FL|" config.make
          make
          cd ../bin
          mkdir -p dist
          make xfoil FC=gfortran FFLAGS="$FL" FFLOPT="$FL" \
            PLTOBJ=../plotlib/libPlt_gDP.a PLTLIB="-lX11" \
            FTNLIB="-static-libgfortran -static-libgcc" BINDIR="$PWD/dist/"
          # Smoke test: the sweep that crashes the Debian binary must succeed here.
          printf 'PLOP\nG\n\nNACA 0012\nPANE\nOPER\nITER 200\nVISC 1000000\nPACC\np.txt\n\nASEQ 0 18 2\nPACC\n\nQUIT\n' | dist/xfoil >/dev/null 2>&1 || true
          test "$(grep -cE '^[[:space:]]+[0-9]+\.[0-9]' p.txt)" -ge 5
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp dist/xfoil "$GITHUB_WORKSPACE/out/${{ matrix.asset }}"

      # ---------- macOS: X11 backend via XQuartz ----------
      - name: Build (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          brew install gcc
          brew install --cask xquartz     # provides X11 headers/libs at /opt/X11
          curl -fsSL "$XFOIL_URL" -o xfoil.tgz
          tar xzf xfoil.tgz
          cd Xfoil/plotlib
          cp config.make.gfortranDP config.make
          make FC=gfortran \
            FFLAGS="-O2 -fdefault-real-8 -std=legacy -fallow-argument-mismatch" \
            CFLAGS="-O2 -DUNDERSCORE -I/opt/X11/include"
          cd ../bin
          mkdir -p dist
          make xfoil FC=gfortran FFLAGS="$FL" FFLOPT="$FL" \
            PLTOBJ=../plotlib/libPlt_gDP.a PLTLIB="-L/opt/X11/lib -lX11" \
            FTNLIB="-static-libgfortran -static-libgcc" BINDIR="$PWD/dist/"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp dist/xfoil "$GITHUB_WORKSPACE/out/${{ matrix.asset }}"

      # ---------- Windows: Win32 (mingw) backend, no X11 ----------
      - name: Setup MSYS2 (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc-fortran make curl tar
      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          curl -fsSL "$XFOIL_URL" -o xfoil.tgz
          tar xzf xfoil.tgz
          cd Xfoil/plotlib
          # Win32 GDI plot backend (no X11); produces libPlt_gfortran.a
          make -f Makefile.mingw FC=gfortran CC=gcc \
            FFLAGS="-O2 -fdefault-real-8 -std=legacy -fallow-argument-mismatch" \
            CFLAGS="-O2 -DUNDERSCORE"
          cd ../bin
          mkdir -p dist
          make xfoil FC=gfortran FFLAGS="$FL" FFLOPT="$FL" \
            PLTOBJ=../plotlib/libPlt_gfortran.a PLTLIB="-lgdi32 -luser32" \
            FTNLIB="-static -static-libgfortran -static-libgcc" BINDIR="$PWD/dist/" || true
          BIN="$(find . -maxdepth 3 \( -name 'xfoil.exe' -o -name 'xfoil' \) -type f | head -1)"
          test -n "$BIN"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$BIN" "$GITHUB_WORKSPACE/out/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: warn

  release:
    needs: build
    if: always()          # publish whatever built even if some OS still needs work
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish to fixed XFOIL release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: XFOIL 6.99 binaries
          files: artifacts/*
          body: |
            XFOIL 6.99 compiled from MIT source (GPL) with stable gfortran flags.
            Downloaded and cached by AVL Editor's XfoilManager.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
